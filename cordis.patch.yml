# The dsh-wiring bundle patch: one insert that mounts the shipped LSP packages
# and this package's read-only doctor over the profile root.
#
# Row order carries no load semantics (activation is service-availability
# driven); the listed order is the order a reader should follow.
#
# ONE LANGUAGE PER ROW. Every entry in a `servers` record resolves at load, and
# a single bad entry rolls back every provider registered by that instance. Two
# languages in one row would therefore take each other down; separate rows fail
# independently.
#
# The browser provider row ships disabled: a startup failure rejects Session
# creation, so enabling it is an explicit opt-in; an enabled provider never
# adopts an existing Session — start a new one.
#
# Only the webhook ingress row ships disabled: it needs a webhook secret and
# must sit behind TLS. `workspacePath: ''` means the host working directory.

- insert:
    - id: wiring-lsp
      name: '@deepseek-ai/dsh-lsp'

    - id: wiring-lsp-typescript
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          typescript:
            command: typescript-language-server
            args: ['--stdio']
            extensionToLanguage:
              '.ts': typescript
              '.tsx': typescriptreact
              '.mts': typescript
              '.cts': typescript
              '.js': javascript
              '.jsx': javascriptreact
              '.mjs': javascript
              '.cjs': javascript

    - id: wiring-lsp-tool
      name: '@deepseek-ai/dsh-tool-lsp'

    - id: wiring-doctor
      name: '@leiboss/dsh-wiring'

    - id: wiring-browser-use
      name: '@deepseek-ai/dsh-browser-use'

    - id: wiring-browser-playwright
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      disabled: true
      config:
        mode: launch
        headless: true

    - id: wiring-webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: wiring-webhook-rule
      name: '@leiboss/dsh-wiring/rule'
      config:
        workspacePath: ''
        agentPreset: standard
        permissionPreset: workspace-write
        events: ['opened', 'synchronize', 'reopened']

    - id: wiring-webhook-github
      name: '@deepseek-ai/dsh-webhook-github'
      disabled: true
      config:
        source: primary-github
        path: /webhook/github
        secretEnv: GITHUB_WEBHOOK_SECRET
        maxBodyBytes: 1048576

    # ── Optional languages: copy one block at a time ─────────────────────────
    #
    # Python (pyright): npm install -g pyright
